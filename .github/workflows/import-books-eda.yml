name: Import Books EDA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/books-eda
          curl -fsSL https://codeload.github.com/ranjithbrs/books-data-analysis/tar.gz/refs/heads/main \
            | tar -xz --strip-components=1 -C /tmp/books-eda
          cp -a /tmp/books-eda/. .
          rm -rf .github
          cat >> README.md <<'EOF'

          ---

          ## Mirror and attribution

          This repository contains a mirror of the upstream project:
          https://github.com/ranjithbrs/books-data-analysis

          Original author: Ranjith B. The upstream MIT license and copyright notice
          are retained in the LICENSE file. Please refer to the upstream repository
          for the original project history and updates.
          EOF

      - name: Commit and push imported files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Books EDA project with attribution"
          git push origin HEAD:main
